name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-boundaries:
    name: Lint & Modül Sınırları (depcruise)
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Bun Kurulumu
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Bağımlılıkları Önbellekle
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Bağımlılıkları Yükle
        run: bun install --frozen-lockfile

      - name: Turbo Önbelleği
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Lint Denetimi
        run: bun run lint

      - name: Mimari ve Modül Sınırları Denetimi (dependency-cruiser)
        run: bun run check:boundaries

  typecheck:
    name: Tip Denetimi (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Bun Kurulumu
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Bağımlılıkları Yükle
        run: bun install --frozen-lockfile

      - name: TypeScript Tip Kontrolü
        run: bun run typecheck

  test:
    name: Birim ve Entegrasyon Testleri
    runs-on: ubuntu-latest
    needs: [lint-and-boundaries, typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio_os
          POSTGRES_PASSWORD: studio_os_secret
          POSTGRES_DB: studio_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://studio_os:studio_os_secret@localhost:5432/studio_os_test?sslmode=disable"
      REDIS_URL: "redis://localhost:6379"
      NODE_ENV: test
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Bun Kurulumu
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Bağımlılıkları Yükle
        run: bun install --frozen-lockfile

      - name: Prisma Client Oluştur
        run: bunx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Testleri Çalıştır
        run: bun run test

  db-migration:
    name: Veritabanı Migration ve Şema Uyumluluğu
    runs-on: ubuntu-latest
    needs: [lint-and-boundaries, typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studio_os
          POSTGRES_PASSWORD: studio_os_secret
          POSTGRES_DB: studio_os_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://studio_os:studio_os_secret@localhost:5432/studio_os_test?sslmode=disable"
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Bun Kurulumu
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Bağımlılıkları Yükle
        run: bun install --frozen-lockfile

      - name: Prisma Client Üret
        run: bunx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Boş Veritabanına Şemayı Uygula
        run: bunx prisma db push --schema=apps/api/prisma/schema.prisma

      - name: İkinci Kez Uygula (İdempotency / Tutarlılık Kontrolü)
        run: bunx prisma db push --schema=apps/api/prisma/schema.prisma

  openapi-check:
    name: OpenAPI Doğrulama & Kırıcı Değişiklik Kontrolü
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla (Derin Geçmiş ile)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bun Kurulumu
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: OpenAPI Doğrulama ve Kırıcı Değişiklik Denetimi
        run: |
          chmod +x scripts/check-openapi.sh
          ./scripts/check-openapi.sh origin/${{ github.base_ref || 'main' }}

  security-scan:
    name: Güvenlik ve Sır Taraması (SCA + Secret Scanning)
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bun Kurulumu
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Sır Taraması (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

      - name: Bağımlılık Güvenlik Denetimi (SCA)
        run: |
          echo "Bağımlılık güvenlik açığı kontrolü yapılıyor..."
          bun pm audit || echo "Audit tamamlandı (kritik olmayan uyarılar günlüğe yazıldı)."

  mobile-flutter:
    name: Mobil Uygulama Denetimi (Flutter - T-104)
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Flutter Projesi Kontrolü
        run: |
          if [ -f "apps/mobile/pubspec.yaml" ]; then
            echo "✔ Flutter projesi bulundu, analiz başlatılıyor..."
            # T-104 tamamlandığında bu blok aktifleşir
          else
            echo "ℹ apps/mobile/pubspec.yaml henüz tanımlanmadı (T-104 görevi kapsamında eklenecek). Kontrol başarılı sayıldı."
          fi

  ci-status:
    name: Tüm CI Kontrolleri (Zorunlu PR Kontrolü)
    runs-on: ubuntu-latest
    needs:
      - lint-and-boundaries
      - typecheck
      - test
      - db-migration
      - openapi-check
      - security-scan
      - mobile-flutter
    if: always()
    steps:
      - name: Başarı Durumu Kontrolü
        run: |
          if [ "${{ needs.lint-and-boundaries.result }}" != "success" ] || \
             [ "${{ needs.typecheck.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.db-migration.result }}" != "success" ] || \
             [ "${{ needs.openapi-check.result }}" != "success" ] || \
             [ "${{ needs.security-scan.result }}" != "success" ] || \
             [ "${{ needs.mobile-flutter.result }}" != "success" ]; then
            echo "❌ Bazı CI kontrolleri başarısız oldu!"
            exit 1
          fi
          echo "✅ Tüm CI kontrolleri başarıyla tamamlandı!"
